<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb7d5">
<title>Sakura OS PWA</title>
<style>
body{font-family:system-ui;background:#fff7fb;padding:20px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
button,input,textarea{width:100%;margin:6px 0;padding:10px}
</style></head>
<body>
<div class="card">
<h1>🌸 Sakura OS PWA</h1>
<p>Install me from your browser menu → Add to Home Screen.</p>
<input id="idea" placeholder="Opportunity idea">
<textarea id="note" placeholder="Notes"></textarea>
<button onclick="save()">Save</button>
<pre id="out"></pre>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
function save(){
 let arr=JSON.parse(localStorage.getItem('ideas')||'[]');
 arr.push({idea:idea.value,note:note.value,date:new Date().toLocaleString()});
 localStorage.setItem('ideas',JSON.stringify(arr));
 render();
}
function render(){out.textContent=localStorage.getItem('ideas')||'[]';}
render();
</script>
</body></html>
